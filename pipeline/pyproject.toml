[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openacts-pipeline"
version = "0.1.0"
description = "Local ingestion pipeline for the OpenActs corpus"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.23",
  "pydantic-ai-slim[openai]>=2,<3",
  "psycopg[binary]>=3.3,<4",
  "pypdf>=6.0",
  "referencing>=0.36",
]

[project.scripts]
openacts = "openacts_pipeline.acquire:main"
openacts-projection = "openacts_pipeline.projection:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.12",
]
ocr = [
  "paddleocr==3.7.0",
  "paddlepaddle==3.2.0",
  "pypdfium2==5.12.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/openacts_pipeline"]

[tool.pytest.ini_options]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 88
