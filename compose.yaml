services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${OPENACTS_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./api/sql/001_projection.sql:/docker-entrypoint-initdb.d/001_projection.sql:ro
      - ./api/sql/local.sh:/docker-entrypoint-initdb.d/002_local.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 1s
      timeout: 3s
      start_period: 90s
      retries: 30

volumes:
  postgres-data:
