[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openacts-api"
version = "0.1.0"
description = "Read-only HTTP API for an active OpenActs corpus projection"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "psycopg[binary,pool]>=3.3,<4",
  "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx2>=2,<3",
  "pytest>=8.3",
  "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/openacts_api"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
